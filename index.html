<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Student Like Me">
<meta name="theme-color" content="#121E3A">
<link rel="apple-touch-icon" href="icon.png">
<title>Student Like Me</title>
<style>
:root{--navy:#121E3A;--navy2:#1E2E52;--gold:#F5A623;--cream:#FAF6EE;--teal:#1F8A8A;--soft:#E8ECF4;--ink:#1F2937;--muted:#5B6678;--good:#2E9E5B;--bad:#D9534F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--cream);position:relative}
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top .hi{font-size:13px;color:#C8D0E0}
.top .goal{font-size:19px;font-weight:700;margin-top:2px}
.xp{background:var(--gold);color:var(--navy);font-weight:800;border-radius:999px;padding:6px 12px;font-size:14px}
main{padding:16px 16px 110px}
h1{font-size:26px;margin:0 0 6px;color:var(--navy)}
h2{font-size:19px;margin:20px 0 8px;color:var(--navy)}
p.sub{color:var(--muted);margin:0 0 14px;line-height:1.4}
.card{background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 4px rgba(18,30,58,.08)}
.card.navy{background:var(--navy);color:#fff}
.card.soft{background:var(--soft)}
.card.sel{outline:3px solid var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:var(--gold);color:var(--navy);margin:12px 0 0;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.btn:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--soft);background:#fff;color:var(--navy);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
input[type=text],textarea{width:100%;border:2px solid var(--soft);border-radius:14px;padding:13px;font-size:17px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.hero{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 50px) 22px 26px;border-radius:0 0 28px 28px}
.hero h1{color:#fff;font-size:38px}
.hero .tag{color:var(--gold);font-size:18px;line-height:1.35}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #dde2ec;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:9}
.tab{flex:1;text-align:center;border:0;background:none;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tab span{display:block;font-size:22px;margin-bottom:1px}
.tab.on{color:var(--navy)}
.tab.on span{transform:scale(1.15)}
.pcard{display:flex;gap:14px;align-items:center;cursor:pointer}
.pcard .em{font-size:38px}
.pcard b{font-size:18px;color:var(--navy)}
.pcard small{color:var(--muted);display:block;margin-top:2px}
.badge{display:inline-block;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:middle}
.rail{position:relative;padding-left:56px;margin:0}
.rail::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:4px;background:var(--gold);border-radius:2px}
.node{position:relative;margin:10px 0}
.node .dot{position:absolute;left:-56px;top:2px;width:44px;height:44px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid var(--cream)}
details{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 4px rgba(18,30,58,.08)}
summary{font-weight:700;color:var(--navy);font-size:16px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--gold);font-size:20px;font-weight:800}
details[open] summary::after{content:"\2212"}
details p{margin:8px 0 4px;color:var(--ink);line-height:1.45;font-size:15px}
.src{font-size:12px;color:var(--muted);margin-top:6px}
.kv{display:flex;gap:8px;margin:6px 0;font-size:14px;line-height:1.35}
.kv b{min-width:78px;color:var(--teal)}
.row{display:flex;gap:12px;align-items:flex-start}
.check{width:30px;height:30px;border-radius:50%;border:3px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:#fff;cursor:pointer;margin-top:1px}
.check.on{background:var(--good);border-color:var(--good)}
.type{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--teal);text-transform:uppercase}
.why{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.35}
.skill{display:inline-block;font-size:12px;font-weight:700;background:var(--soft);color:var(--navy);border-radius:999px;padding:3px 9px;margin-top:6px}
.pb{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:8px 0}
.pb i{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--soft);display:block}
.dots i.on{background:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.3)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--soft);background:#fff;border-radius:14px;padding:13px;font-size:16px;margin:8px 0;color:var(--ink);cursor:pointer;font-family:inherit}
.opt.good{border-color:var(--good);background:#E8F6EE}
.opt.bad{border-color:var(--bad);background:#FBEAEA}
.fb{border-radius:14px;padding:12px 14px;margin-top:10px;line-height:1.45}
.fb.good{background:#E8F6EE}
.fb.ok{background:#FFF3DC}
.demo{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0;line-height:1.4}
.share{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:20px}
.share h3{margin:0;font-size:22px}
.share .m{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.5px;margin-top:14px}
.share .dots i{background:rgba(255,255,255,.2)}
.share .dots i.on{background:var(--gold)}
.pop{position:fixed;pointer-events:none;font-size:26px;z-index:99;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;z-index:100;font-weight:700;max-width:90%;text-align:center;animation:fade 2.4s forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.stp{display:inline-block;background:var(--soft);color:var(--navy);font-size:12px;font-weight:700;border-radius:999px;padding:4px 9px;margin:2px 0}
.jr{display:flex;align-items:center;margin:2px 0 14px}
.js{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.jd{width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--navy);border:3px solid var(--soft)}
.js.done .jd{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.js.next .jd{border-color:var(--gold);background:#fff}
.jl{font-size:11px;font-weight:700;color:var(--muted)}
.js.done .jl,.js.next .jl{color:var(--navy)}
.jline{flex:1;height:3px;background:var(--soft);margin:0 2px 16px}
.back{border:0;background:none;color:var(--teal);font-weight:700;font-size:16px;padding:0;margin-bottom:8px;cursor:pointer}
</style>
</head>

/* ---------- Journey strip (the 5 steps) ---------- */
function journey(){const anyT=Object.values(S.tdone).some(Boolean),anyA=Object.values(S.done).some(Boolean);
 const st=[["Discover","🎯",!!S.path,null],["Explore","🧭",!!(S.seen.route||S.seen.people),"explore:route"],["Compare","⚖️",!!S.seen.compare,"explore:compare"],["Plan","🗺️",!!(S.seen.plan||anyT),"plan"],["Today","✅",anyA,"today"]];
 const nxt=st.findIndex(s=>!s[2]);
 return `<div class="jr">${st.map((s,i)=>`<div class="js ${s[2]?"done":i===nxt?"next":""}" ${s[3]?`data-a="jstep" data-v="${s[3]}"`:""}><div class="jd">${s[2]?"✓":s[1]}</div><div class="jl">${s[0]}</div></div>`).join('<div class="jline"></div>')}</div>`;}

 const acts=weekActions();const allDone=acts.every(a=>S.done[dkey(a.idx)]);

 let h=header()+`<main>${journey()}

 h+=acts.map(a=>{const on=S.done[dkey(a.idx)];return `<div class="card row"><div class="check ${on?"on":""}" data-a="act" data-v="${a.idx}">${on?"✓":""}</div><div><div style="font-size:17px;font-weight:700;color:var(--navy)">${a.t}</div><div class="why">Why: ${a.why}</div><span class="skill">${SK[a.skill][0]} ${SK[a.skill][1]} +10</span></div></div>`;}).join("");
 if(allDone){const R=S.reflect||{};h+=`<div class="card navy"><b style="font-size:18px">🎉 Week complete! Quick check-in</b><div style="margin-top:8px">How did it feel?</div>
<div class="chips">${[["😀","great"],["🙂","ok"],["😕","hard"]].map(m=>`<button class="chip ${R.mood===m[1]?"on":""}" style="${R.mood===m[1]?"background:var(--gold);color:var(--navy);border-color:var(--gold)":""}" data-a="mood" data-v="${m[1]}">${m[0]}</button>`).join("")}</div>
${R.mood?`<div style="margin-top:6px">Anything get in the way?</div><div class="chips">${[["time","⏰ Time"],["motivation","😴 Motivation"],["transport","🚌 Getting around"],["how","🤷 Didn't know how"],["other","💭 Other"]].map(b=>`<button class="chip ${R.block===b[0]?"on":""}" style="${R.block===b[0]?"background:var(--gold);color:var(--navy);border-color:var(--gold)":""}" data-a="block" data-v="${b[0]}">${b[1]}</button>`).join("")}</div>`:""}
${R.mood&&R.block?`<div class="fb good" style="color:var(--ink)">${R.mood==="great"?"Love that. Keep the momentum.":R.mood==="ok"?"Solid week. Small steps add up.":"That's okay. Hard weeks happen."} ${BLOCK[R.block]}</div><button class="btn" data-a="nextweek">Start next week →</button>`:""}
</div>`;}
 h+=`<h2>Next in your plan</h2><div class="card" style="padding-top:6px;padding-bottom:6px">${nextTasks.length?nextTasks.map(tRow).join(""):"<div style='padding:8px 0'>You finished the plan! 🎉</div>"}<button class="btn ghost" data-a="tab" data-v="plan">See full plan →</button></div>

 const all=tasks();const dn=all.filter(t=>S.tdone[t.id]).length,pct=Math.round(dn/all.length*100);const dl=nextDeadline(A);
 const st=all.filter(t=>t.stage===g);const sd=st.filter(t=>S.tdone[t.id]).length;

/* ============ ACTIONS ============ */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a,v=el.dataset.v;
 const nm=document.getElementById("nm");if(nm)S.name=nm.value.trim();
 const sc=document.getElementById("sc");if(sc)S.school=sc.value.trim();
 const ac=document.getElementById("acts");if(ac)S.actsText=ac.value;
 const keep=scrollY;
 const stay=()=>{save();render();scrollTo(0,keep);};
 switch(a){
  case "grade":S.grade=+v;S.planGrade=+v;stay();break;
  case "interest":{const i=S.interests.indexOf(v);i>=0?S.interests.splice(i,1):S.interests.push(v);stay();break;}
  case "start":S.screen="app";if(!S.name)S.name="Friend";S.planGrade=S.grade;save();draw(true);break;
  case "goalgo":{const t=document.getElementById("goal").value;const m=matchPath(t);if(m){choose(m);}else{S.sparkMsg=t.trim()?"I don't have a sample path for that yet. Try one below. The full app would build one from verified sources.":"Type something you're curious about, or tap a path below.";save();render();}break;}
  case "pick":choose(v);break;
  case "job":{const j=JOBS[+v];if(j.path)choose(j.path);else toast("Ladder for this job is coming soon (demo)");break;}
  case "surprise":{const ids=Object.keys(PATHS);choose(ids[Math.floor(Math.random()*ids.length)]);toast("🎲 Surprise! Take a look.");break;}
  case "tab":S.tab=v;Q=null;save();draw(true);break;
  case "jstep":{const [t,s]=v.split(":");S.tab=t;if(s)S.xseg=s;Q=null;save();draw(true);break;}
  case "xseg":S.xseg=v;save();draw(true);break;
  case "route":S.route=+v;S.track=null;stay();break;
  case "chooseRoute":S.route=+v;S.track=null;S.xseg="route";save();draw(true);toast("Route selected");break;
  case "track":S.track=v;stay();break;
  case "cycletrack":{const ks=Object.keys(TRACKS);S.track=ks[(ks.indexOf(curTrack())+1)%ks.length];stay();break;}
  case "pg":S.planGrade=+v;stay();break;
  case "planall":S.planAll[v]=!S.planAll[v];stay();break;
  case "tools":{const cur=S.toolsOpen===null?S.grade>=11:S.toolsOpen;S.toolsOpen=!cur;stay();break;}
  case "ttoggle":{S.tdone[v]=!S.tdone[v];if(S.tdone[v]&&!S.xpGiven[v]){S.xpGiven[v]=true;const t=tasks().find(x=>x.id===v);if(t){const sk=TYPE_SKILL[t.type]||"prepare";award(sk,10);toast(SK[sk][1]+" +10 ⭐");}burst(el,["✨","⭐"]);}stay();break;}
  case "portal":S.portals[v]=!S.portals[v];stay();break;
  case "addprog":{const n=prompt("Add a school, program, or employer");if(n&&n.trim()){S.progs[v].push(n.trim().slice(0,40));stay();}break;}
  case "rmprog":{const [b,i]=v.split(":");if(confirm("Remove "+S.progs[b][+i]+"?")){S.progs[b].splice(+i,1);stay();}break;}
  case "sortacts":{const lines=S.actsText.split(/\n+/).map(x=>x.trim()).filter(Boolean);const out=lines.map(t=>{let c="Other",r=CATS.length;CATS.forEach((cat,idx)=>{if(r===CATS.length&&cat[1].test(t)){c=cat[0];r=idx;}});return {t,c,r};});out.sort((a,b)=>a.r-b.r);S.actsOut=out;stay();break;}
  case "pf":S.pfilter=v;stay();break;
  case "ask":toast("💬 Intro request sent through your counselor (demo)");break;
  case "save":S.saved[v]=!S.saved[v];stay();if(S.saved[v])toast("Saved to your inspiration list");break;
  case "act":{const acts=weekActions();const x=acts.find(q=>q.idx===+v);const k=dkey(x.idx);if(!S.done[k]){S.done[k]=true;award(x.skill,10);stay();const n=document.querySelector(`[data-a="act"][data-v="${v}"]`);burst(n);toast(SK[x.skill][1]+" +10 ⭐");}break;}
  case "mood":S.reflect=Object.assign(S.reflect||{},{mood:v});stay();break;
  case "block":S.reflect=Object.assign(S.reflect||{},{block:v});stay();break;
  case "nextweek":S.week++;S.reflect=null;save();draw(true);burst(null,["🌟","🚀"]);toast("New week unlocked!");break;
  case "startq":Q={kind:v,pick:null};draw(true);break;
  case "qback":Q=null;draw(true);break;
  case "qpick":{const i=+v;Q.pick=i;const q=P()[Q.kind];const key=S.path+":"+Q.kind;const good=Q.kind==="quiz"?i===q.ans:q.opts[i].good;if(!S.qDone[key]){S.qDone[key]=true;award(q.skill,good?15:5);save();}if(good)burst(el);render();scrollTo(0,keep);break;}
  case "saveletter":S.letter=document.getElementById("letter").value;save();toast("Letter saved 💌");break;
  case "pivot":{const have=Object.keys(S.xp).filter(k=>S.xp[k]>0).map(k=>SK[k][1]);S.path=null;S.tab="today";S.sparkMsg=have.length?"Your skills still count: "+have.join(", ")+".":"";save();draw(true);break;}
  case "reset":if(confirm("Erase all demo data on this device?")){localStorage.removeItem("slm");S=fresh();draw(true);}break;
 }
});
function choose(id){S.path=id;S.route=0;S.track=null;S.tab="explore";S.xseg="route";S.sparkMsg="";S.reflect=null;save();draw(true);burst(null,[PATHS[id].emoji,"✨"]);}
draw();
</script>
</body>
